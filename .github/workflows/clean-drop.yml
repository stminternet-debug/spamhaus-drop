name: Clean Spamhaus DROP
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y limpiar
        run: |
          mkdir -p mikrotik
          echo "/ip firewall address-list" > mikrotik/HN-BLACKLIST-SPAMHAUS.rsc
          curl -s https://www.spamhaus.org/drop/drop.txt \
            | grep -E '^[0-9]+\.' | cut -d' ' -f1 | sort -u \
            | while read cidr; do
                echo "add list=HN-BLACKLIST-SPAMHAUS comment=SPAMHAUS-DROP address=$cidr"
              done >> mikrotik/HN-BLACKLIST-SPAMHAUS.rsc
      - name: Publicar
        run: |
          git config user.name "drop-cleaner"
          git config user.email "drop-cleaner@users.noreply.github.com"
          git add mikrotik/HN-BLACKLIST-SPAMHAUS.rsc
          git commit -m "DROP $(date -u +%F)" || echo "sin cambios"
          git push
